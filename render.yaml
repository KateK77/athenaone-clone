# Paid web + PostgreSQL portfolio demo. Review current Render pricing before sync.
databases:
  - name: athenaflow-demo-db
    plan: 0.1c-256mb
    region: oregon
    databaseName: athenaflow_demo
    user: athenaflow
    ipAllowList: []
services:
  - type: web
    name: athenaflow-demo
    runtime: python
    plan: 0.5c-512mb
    region: oregon
    buildCommand: bash scripts/build.sh
    preDeployCommand: python manage.py migrate --noinput
    startCommand: gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --timeout 60 --access-logfile -
    healthCheckPath: /health/
    autoDeployTrigger: checksPass
    initialDeployHook: python manage.py seed_demo
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.12
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "false"
      - key: DEMO_MODE
        value: "true"
      - key: ALLOW_DEMO_RESET
        value: "false"
      - key: DATABASE_URL
        fromDatabase:
          name: athenaflow-demo-db
          property: connectionString
      - key: ALLOWED_HOSTS
        sync: false
      - key: CSRF_TRUSTED_ORIGINS
        sync: false
